services:
  postgres:
    image: postgres:16-alpine
    container_name: egofederation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: egofederation_bot
    volumes:
      - pg_data:/var/lib/postgresql/data

  telegram-bot:
    build: .
    container_name: egofederation-telegram-bot
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/egofederation_bot

volumes:
  pg_data:
